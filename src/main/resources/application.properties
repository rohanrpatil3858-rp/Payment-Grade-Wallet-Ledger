spring.application.name=payment-grade-wallet-ledger

# PostgreSQL database connection. The URL/username can be overridden by the SPRING_DATASOURCE_URL
# and SPRING_DATASOURCE_USERNAME environment variables (Docker sets these to point at the db service);
# locally they default to a native Postgres on localhost.
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_wallet
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# OpenRouter (Milestone 5 LLM provider)
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=openai/gpt-4o-mini
