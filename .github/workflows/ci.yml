name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: digital_wallet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until Postgres is actually ready before running the tests.
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches the credentials the integration tests connect with.
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the full test suite
        # A non-zero gradle exit code fails this step, which fails the workflow.
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
